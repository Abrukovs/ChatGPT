name: Daily decision journal tests

on:
  push:
    branches: [main, feature/daily-decisions-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test daily decisions
        run: python -m unittest -v test_daily_decisions.py
