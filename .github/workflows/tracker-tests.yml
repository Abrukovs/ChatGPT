name: Prediction tracker tests
on:
  push:
    branches: [main]
    paths: ['tracker/**', 'app.py', 'tests_tracker/**', 'requirements.txt', '.github/workflows/tracker-tests.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
