name: Journal tests

on:
  push:
    branches: ["main", "feature/csv-journal-tests"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run journal tests
        run: python -m unittest -v test_journal_writer.py
